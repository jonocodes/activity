<!doctype html>
<!--
  PROTOTYPE, throwaway. Question: does the v1 page specified in issue #1 / docs/design.md look right on real data?
  One variant left (2026-11-25): B (a sidebar layout) and C (year by year) were dropped; C's per-year summary moved into A's older-year sections.
  Earlier variants, switchable with ?variant= and the bottom bar:
    A  As specified: profile + stats strip + heatmap, then Feed / Projects tabs, older years collapsed.
    C  Year by year: the whole page is a timeline of years, each with its heatmap, stats, repos and items.
  Shared: the data rules (commit dedup, forks folded into upstream, groups, owner's time zone, streaks, licences).
  ?favorites=owner/repo,owner/repo sets the favorites in order (stands in for ACTIVITY_FAVORITES; the demo default is a sample list).
  ?tz=<IANA zone> overrides the owner's time zone (default: your browser's). Data: prototype/data.json (public only).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity prototype</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d8dee4; --card:#f6f8fa; --accent:#0969da; --heat:#2da44e;
    --k-commit:#0969da; --k-pr:#8250df; --k-issue:#1a7f37; --k-discussion:#bf8700; --k-discussion_reply:#9a6700; --k-review:#cf222e;
    --k-new_repo:#bc4c00; --k-fork:#57606a; --k-issue_comment:#8c959f; --k-commit_comment:#8c959f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --line:#30363d; --card:#161b22; --accent:#4493f8; --heat:#3fb950;
    --k-commit:#4493f8; --k-pr:#a371f7; --k-issue:#3fb950; --k-discussion:#d29922; --k-discussion_reply:#bb8009; --k-review:#f85149; --k-new_repo:#db6d28; --k-fork:#8d96a0; } }
  :root { --viz:#2a78d6; --viz-track:#dbe8f8; } @media (prefers-color-scheme: dark) { :root { --viz:#3987e5; --viz-track:#1f2d40; } }
  .overview { display:grid; grid-template-columns: 1fr 1fr; gap: 28px; margin: 4px 0 14px; }
  .meter h4 { margin: 0 0 6px; font-size:.8em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; }
  .meter .m { display:grid; grid-template-columns: 110px 1fr 44px; gap: 8px; align-items:center; font-size:.85em; padding: 1px 0; }
  .meter .bar { height: 8px; background: var(--viz-track); border-radius: 4px; overflow:hidden; } .meter .bar i { display:block; height:100%; background: var(--viz); border-radius: 4px; }
  .meter .v { text-align:right; color:var(--muted); font-variant-numeric: tabular-nums; }
  .kpis { display:flex; gap: 26px; margin: 8px 0 4px; } .kpis .n { font-size: 1.6em; font-weight: 650; display:block; line-height:1.1; } .kpis .l { font-size:.78em; color:var(--muted); }
  .axis { display:grid; grid-template-columns: 1fr 300px; margin-top: 8px; } .axis svg { overflow: visible; }
  .proj.wide { grid-template-columns: 1fr 300px; } .owner { font-size:.8em; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin: 16px 0 0; }
  .proto { font-size:.75em; color:#b35900; margin: 4px 0; } .proto a { color:#b35900; text-decoration: underline; }
  svg.tl { width: 100%; max-width: 300px; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 96px; }
  h1 { font-size: 1.7em; margin: 0 0 4px; } h2 { font-size: 1.15em; margin: 28px 0 8px; } h3 { font-size:.8em; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 0 4px; border-bottom:1px solid var(--line); padding-bottom:2px; }
  .muted { color: var(--muted); } .small { font-size: .85em; }
  .profile { color: var(--muted); margin: 4px 0 12px; } .profile span + span::before { content: " · "; }
  .strip { display:flex; flex-wrap:wrap; gap: 8px 22px; padding: 12px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin: 10px 0 14px; }
  .strip .n { font-size: 1.35em; font-weight: 650; display:block; line-height:1.1; } .strip .l { font-size:.78em; color:var(--muted); }
  .strip .sep { width:1px; background:var(--line); }
  svg.heat { width: 100%; height: auto; display:block; margin: 6px 0; }
  .tabs { display:flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 8px; }
  .tabs button { background:none; border:none; padding: 8px 14px; font: inherit; color: var(--muted); cursor:pointer; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin: 8px 0; }
  .chip { border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius: 999px; padding: 1px 10px; font-size:.8em; cursor:pointer; }
  .chip.off { opacity:.4; } .chip i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  .filter { background: var(--card); border:1px solid var(--line); padding: 4px 10px; border-radius: 6px; font-size:.85em; margin: 6px 0; }
  .row { display:grid; grid-template-columns: 110px 1fr auto; gap: 10px; padding: 3px 0; align-items: baseline; }
  .row .t { overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size:.7em; font-weight:600; text-transform:uppercase; color:#fff; padding: 1px 6px; border-radius: 4px; white-space:nowrap; }
  .repo { font-family: ui-monospace, monospace; font-size:.85em; color: var(--muted); }
  details.group > summary { list-style:none; cursor:pointer; } details.group > summary::-webkit-details-marker { display:none; }
  details.group > summary .t::after { content: " ▸"; color: var(--muted); } details.group[open] > summary .t::after { content: " ▾"; }
  details.group .inner { margin-left: 120px; border-left: 2px solid var(--line); padding-left: 10px; font-size:.9em; }
  details.year { border-top: 1px solid var(--line); padding: 6px 0; } details.year > summary { cursor:pointer; font-weight:600; font-size:1.05em; }
  .proj { display:grid; grid-template-columns: 1fr 130px; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .proj .name { font-weight: 600; cursor:pointer; color: var(--accent); }
  .proj .counts { font-size:.82em; color:var(--muted); } .proj .counts b { color: var(--fg); }
  .proj .spark { grid-row: 1 / span 3; grid-column: 2; align-self:center; }
  .badge { font-size:.72em; border:1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); margin-left: 6px; }
  .note { font-size:.8em; color:var(--muted); margin: 6px 0; }
  footer { margin-top: 40px; font-size:.8em; color:var(--muted); }
  /* B */
  .side { display:grid; grid-template-columns: 300px 1fr; gap: 28px; max-width: 1200px; margin: 0 auto; padding: 24px 16px 96px; }
  .side aside { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow:auto; padding-right: 8px; }
  .side aside .strip { display:grid; grid-template-columns: 1fr 1fr; }
  .side aside .rl { font-size:.85em; padding: 3px 6px; border-radius: 5px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .side aside .rl:hover, .side aside .rl.on { background: var(--card); }
  /* C */
  .yr { border-top: 2px solid var(--line); margin-top: 26px; padding-top: 8px; }
  .yr .head { display:flex; align-items: baseline; gap: 14px; flex-wrap:wrap; } .yr .head .big { font-size: 2em; font-weight: 700; }
  .yr .cols { display:grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { svg.tl { max-width: none; } .row { grid-template-columns: auto 1fr auto !important; } .proj.wide, .axis, .overview { grid-template-columns: 1fr; } .proj.wide .spark { grid-row: auto; grid-column: 1; margin-top: 6px; } .axis > span { display: none; } .side { grid-template-columns: 1fr; } .side aside { position: static; max-height:none; } .yr .cols { grid-template-columns: 1fr; } .row { grid-template-columns: 90px 1fr auto; } details.group .inner { margin-left: 0; } }
  /* prototype switcher: not part of the design */
  #pbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background:#111; color:#fff; border-radius: 999px; padding: 6px 8px; display:flex; gap:10px; align-items:center; box-shadow: 0 4px 18px rgba(0,0,0,.35); font: 13px system-ui; z-index: 9; }
  #pbar button { background:#333; color:#fff; border:none; border-radius:50%; width:28px; height:28px; cursor:pointer; font-size: 14px; }
  #pbar span { min-width: 220px; text-align:center; }
</style>
</head>
<body>
<div id="app"><p class="wrap muted">Loading prototype/data.json… (run <code>just prototype</code>)</p></div>
<div id="pbar"><button id="prev">←</button><span id="plabel"></span><button id="next">→</button></div>
<script>
(async () => {
const P = new URLSearchParams(location.search);
const TZ = P.get('tz') || Intl.DateTimeFormat().resolvedOptions().timeZone;
// the main page's data; each older year is fetched from years/<y>.json when opened (prototype/split-data.mjs)
const D = await fetch('data-main.json').then(r => r.ok ? r.json() : fetch('data.json').then(r => r.json()));
const yearFile = y => fetch(`years/${y}.json`).then(r => r.json());
const ME = D.profile.login, NOW = Date.now();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const LABEL = { commit:'commit', pr:'pull request', issue:'issue', discussion:'discussion', discussion_reply:'reply', review:'review', new_repo:'new repo', fork:'fork', issue_comment:'comment', commit_comment:'commit comment' };
const VERB = { commit:'commits', pr:'opened {n} pull requests', issue:'opened {n} issues', discussion:'started {n} discussions', discussion_reply:'{n} discussion replies', review:'reviewed {n} pull requests', new_repo:'created {n} repos', fork:'forked {n} repos', issue_comment:'{n} comments', commit_comment:'{n} commit comments' };
const DEFAULT_ON = ['commit','pr','issue','discussion','discussion_reply','review','new_repo','fork'];

// ---------- data rules (shared by all variants) ----------
// owner's day / week / year, in the owner's time zone
const dayFmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit' });
const day = iso => dayFmt.format(new Date(iso));
const weekOf = iso => { const d = new Date(day(iso) + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7); return d.toISOString().slice(0, 10); };
const yearOf = iso => day(iso).slice(0, 4);
const short = r => r.startsWith(ME + '/') ? r.slice(ME.length + 1) : r;

// repos
const own = Object.fromEntries(D.repos.map(r => [r.nameWithOwner, r]));
// adopted fork: the owner has opened 3 or more pull requests or issues inside it, so its own commits stay with it instead of folding upstream
const insideFork = {}; D.items.filter(i => (i.kind === 'pr' || i.kind === 'issue') && own[i.repo]?.isFork).forEach(i => insideFork[i.repo] = (insideFork[i.repo] || 0) + 1);
const adopted = new Set(Object.keys(insideFork).filter(r => insideFork[r] >= 3));
const upstreamOf = r => own[r]?.isFork && own[r].parent && !adopted.has(r) ? own[r].parent.nameWithOwner : null;
// commits: one per sha; prefer a non-fork repo, else the owner's own fork, else the first hit
const bySha = {};
for (const c of D.commits) {
  const cur = bySha[c.sha];
  const rank = x => !x.fork ? 0 : x.repo.startsWith(ME + '/') ? 1 : 2;
  if (!cur || rank(c) < rank(cur)) bySha[c.sha] = c;
}
const commits = Object.values(bySha).map(c => ({ kind:'commit', at:c.at, repo:c.repo, title:c.msg, url:c.url }));
// timestamps arrive as UTC (Z) from GraphQL but with a local offset from commit search: normalise to UTC, as the design says
const items = [...D.items, ...commits].map(i => ({ ...i, at: new Date(i.at).toISOString() })).sort((a, b) => b.at.localeCompare(a.at));
// Projects: the repo a row belongs to (a fork folds into its upstream)
const rowOf = r => upstreamOf(r) || r;

// groups: same kind + repo + owner's day; commits from 2, others from 3
function grouped(list) {
  const buckets = new Map();
  for (const it of list) { const k = `${it.kind}|${it.repo}|${day(it.at)}`; (buckets.get(k) ?? buckets.set(k, []).get(k)).push(it); }
  const out = [];
  for (const g of buckets.values()) {
    const min = g[0].kind === 'commit' ? 2 : 3;
    if (g.length >= min) out.push({ group: true, kind: g[0].kind, repo: g[0].repo, at: g[0].at, items: g }); else out.push(...g);
  }
  return out.sort((a, b) => b.at.localeCompare(a.at));
}
// dates: a plain date in the owner's zone; the browser turns <1 week into a duration
const dateLabel = iso => { const d = new Date(iso); const sameYear = yearOf(iso) === yearOf(new Date().toISOString());
  return d.toLocaleDateString('en-US', { timeZone: TZ, month:'short', day:'numeric', ...(sameYear ? {} : { year:'numeric' }) }); };
const age = iso => { const s = (NOW - new Date(iso)) / 1000; if (s > 7*86400) return null; if (s < 3600) return `${Math.max(1, Math.round(s/60))} min ago`; if (s < 86400) return `${Math.floor(s/3600)} h ago`; return `${Math.floor(s/86400)} d ago`; };
const timeEl = iso => `<time datetime="${iso}" title="${esc(new Date(iso).toLocaleString('en-US', { timeZone: TZ }))} (${TZ})">${age(iso) ?? dateLabel(iso)}</time>`;

// stats
const count = k => items.filter(i => i.kind === k).length;
const cal = D.lastYear.calendar;
let best = 0, run = 0; cal.forEach(([, n]) => { run = n ? run + 1 : 0; best = Math.max(best, run); });
let cur = 0; { let i = cal.length - 1; if (cal[i] && !cal[i][1]) i--; for (; i >= 0 && cal[i][1]; i--) cur++; }
const STATS = {
  allTime: [['commits', count('commit')], ['pull requests', count('pr')], ['issues', count('issue')], ['discussions', count('discussion')], ['repos created', count('new_repo')]],
  year: [['contributions, last 12 months', D.lastYear.total], ['day streak now', cur], ['longest streak', best]],
  private: D.lastYear.private,
};
const licences = {}; D.repos.filter(r => !r.isFork && r.licenseInfo && r.licenseInfo.spdxId !== 'NOASSERTION').forEach(r => licences[r.licenseInfo.spdxId] = (licences[r.licenseInfo.spdxId] || 0) + 1);
const licenceLine = Object.entries(licences).sort((a, b) => b[1] - a[1]).map(([l, n]) => n > 1 ? `${l} ×${n}` : l).join(' · ');

// projects rows
function projectRows() {
  const per = {};
  const row = r => per[r] ??= { repo: r, commit: 0, pr: 0, issue: 0, discussion: 0, last: '', forks: new Set(), weeks: new Array(52).fill(0), months: new Array(24).fill(0), its: [] };
  for (const it of items) {
    if (!['commit','pr','issue','discussion','discussion_reply'].includes(it.kind)) continue;
    const r = row(rowOf(it.repo)); const k = it.kind === 'discussion_reply' ? 'discussion' : it.kind;
    r[k]++; if (it.at > r.last) r.last = it.at;
    if (upstreamOf(it.repo)) r.forks.add(it.repo);
    r.its.push(it);
    if (it.kind === 'commit') { const d = new Date(it.at), n = new Date(NOW); const m = 23 - ((n.getUTCFullYear() - d.getUTCFullYear()) * 12 + n.getUTCMonth() - d.getUTCMonth()); if (m >= 0 && m < 24) r.months[m]++; }
    if (it.kind === 'commit') { const w = 51 - Math.floor((NOW - new Date(it.at)) / (7 * 864e5)); if (w >= 0 && w < 52) r.weeks[w]++; }
  }
  // favorites: the owner's own ordered list (ACTIVITY_FAVORITES); not GitHub's pins. Demo default: a sample list.
  const favNames = P.has('favorites') ? P.get('favorites').split(',').filter(Boolean) : D.pins.map(p => p.nameWithOwner);
  const favorites = favNames.map(r => ({ ...row(r), meta: own[r] || D.externalRepos?.[r] || D.pins.find(p => p.nameWithOwner === r) }));
  const external = Object.values(per).filter(r => !r.repo.startsWith(ME + '/') && (r.commit + r.pr + r.issue + r.discussion) > 0).sort((a, b) => b.last.localeCompare(a.last)).map(r => ({ ...r, meta: D.externalRepos?.[r.repo] }));
  const mine = D.repos.filter(r => (!r.isFork || !r.parent || adopted.has(r.nameWithOwner)) && !favNames.includes(r.nameWithOwner)).map(m => ({ ...row(m.nameWithOwner), meta: m, last: per[m.nameWithOwner]?.last || m.pushedAt })).sort((a, b) => b.last.localeCompare(a.last));
  const idleForks = D.repos.filter(r => r.isFork && r.parent && !adopted.has(r.nameWithOwner) && !per[r.parent.nameWithOwner]?.forks.has(r.nameWithOwner)).length;
  return { favorites, external, mine, idleForks };
}

// ---------- shared rendering helpers (pieces, not layouts) ----------
const tag = k => `<span class="tag" style="background:var(--k-${k})">${LABEL[k]}</span>`;
function heatmap(c) {
  if (!c?.length) return '';
  const max = Math.max(1, ...c.map(x => x[1])), cell = 11, gap = 2, first = new Date(c[0][0] + 'T00:00:00Z').getUTCDay();
  let rects = '';
  c.forEach(([d, n], i) => { const idx = i + first, x = Math.floor(idx / 7) * (cell + gap), y = (idx % 7) * (cell + gap);
    const op = n === 0 ? .08 : [.3, .5, .75, 1][Math.min(3, Math.floor(4 * Math.sqrt(n / max) - .001))];
    rects += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" fill="var(--heat)" fill-opacity="${op}"><title>${d}: ${n}</title></rect>`; });
  return `<svg class="heat" viewBox="0 0 ${Math.ceil((c.length + first) / 7) * (cell + gap)} ${7 * (cell + gap)}">${rects}</svg>`;
}
function spark(weeks, w = 120, h = 26) {
  const max = Math.max(1, ...weeks);
  const pts = weeks.map((v, i) => `${(i / 51 * w).toFixed(1)},${(h - 2 - v / max * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="var(--k-commit)" stroke-width="1.5"/></svg>`;
}
// depth (Projects): commits per month, last 24 months, as columns; empty months show only the track
function monthBars(months, w = 150, h = 26) {
  const max = Math.max(1, ...months), bw = w / 24 - 2;
  const cols = months.map((v, i) => { const x = i * (bw + 2), bh = v ? Math.max(3, v / max * (h - 2)) : 0;
    return `<rect x="${x.toFixed(1)}" y="${h - 2}" width="${bw.toFixed(1)}" height="2" fill="var(--viz-track)"/>` + (v ? `<rect x="${x.toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="var(--viz)"><title>${v} commits, ${new Date(Date.UTC(new Date(NOW).getUTCFullYear(), new Date(NOW).getUTCMonth() - 23 + i, 1)).toLocaleDateString('en-US', { month:'short', year:'numeric', timeZone:'UTC' })}</title></rect>` : ''); }).join('');
  return `<svg width="${w}" height="${h}" role="img" aria-label="commits per month, last 24 months">${cols}</svg>`;
}
// breadth (Contributing to): one dot per item on a shared time axis, so sparse work reads as marks, not a flat line
function dotStrip(its, from, to, w = 300, h = 18) {
  const x = t => ((new Date(t) - from) / (to - from)) * (w - 8) + 4;
  const dots = its.map(it => `<circle cx="${x(it.at).toFixed(1)}" cy="${h / 2}" r="4" fill="var(--viz)" fill-opacity=".75" stroke="var(--bg)" stroke-width="1"><title>${LABEL[it.kind]} · ${dateLabel(it.at)} · ${esc(it.title)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="tl" style="height:auto;display:block"><line x1="0" x2="${w}" y1="${h / 2}" y2="${h / 2}" stroke="var(--line)"/>${dots}</svg>`;
}
function axisRow(from, to, w = 300) {
  const y0 = new Date(from).getUTCFullYear(), y1 = new Date(to).getUTCFullYear(), step = Math.ceil((y1 - y0 + 1) / 7);
  const x = t => ((t - from) / (to - from)) * (w - 8) + 4;
  let ticks = ''; for (let y = y0 + 1; y <= y1; y += step) ticks += `<text x="${x(Date.UTC(y, 0, 1)).toFixed(1)}" y="10" font-size="10" fill="var(--muted)" text-anchor="middle">${y}</text>`;
  return `<div class="axis"><span></span><svg viewBox="0 0 ${w} 14" class="tl" style="height:auto;display:block;overflow:visible">${ticks}</svg></div>`;
}
// breadth over time: how many different external repos the owner worked in each year (one hue, columns)
function reposPerYear(ext) {
  const by = {}; for (const r of ext) for (const y of new Set(r.its.map(i => yearOf(i.at)))) (by[y] ??= new Set()).add(r.repo);
  const y0 = Math.min(...Object.keys(by).map(Number)), y1 = new Date(NOW).getUTCFullYear(), ys = []; for (let y = y0; y <= y1; y++) ys.push([y, by[y]?.size || 0]);
  const w = 868, h = 90, bw = w / ys.length - 4, max = Math.max(...ys.map(v => v[1]));
  const cols = ys.map(([y, n], i) => { const x = i * (bw + 4), bh = n ? Math.max(3, n / max * (h - 30)) : 0;
    return (n ? `<rect x="${x}" y="${h - 16 - bh}" width="${bw}" height="${bh}" rx="3" fill="var(--viz)"><title>${y}: ${n} repos</title></rect><text x="${x + bw / 2}" y="${h - 20 - bh}" font-size="10" text-anchor="middle" fill="var(--muted)">${n}</text>` : '')
      + `<text x="${x + bw / 2}" y="${h - 3}" font-size="10" text-anchor="middle" fill="var(--muted)">${String(y).slice(2)}</text>`; }).join('');
  return `<div class="meter" style="margin:10px 0 4px"><h4>Other people's repos worked in, per year</h4><svg viewBox="0 0 ${w} ${h}" width="100%">${cols}</svg></div>`;
}
const meterList = (title, entries) => { const max = Math.max(1, ...entries.map(e => e[1]));
  return `<div class="meter"><h4>${title}</h4>${entries.map(([n, v, label]) => `<div class="m" title="${esc(n)}: ${label}"><span>${esc(n)}</span><span class="bar"><i style="width:${(v / max * 100).toFixed(1)}%"></i></span><span class="v">${label}</span></div>`).join('')}</div>`; };
// languages, weighted by the owner's commits (the repo's main language); top 6, rest folded into Other
function languages() {
  const by = {}; let total = 0;
  for (const it of items) { if (it.kind !== 'commit') continue; const l = (own[it.repo] || D.externalRepos?.[it.repo])?.primaryLanguage?.name; if (!l) continue; by[l] = (by[l] || 0) + 1; total++; }
  const e = Object.entries(by).sort((a, b) => b[1] - a[1]), top = e.slice(0, 6), rest = e.slice(6).reduce((s, [, v]) => s + v, 0);
  if (rest) top.push(['Other', rest]);
  return top.map(([n, v]) => [n, v, `${Math.round(v / total * 100)}%`]);
}
const overview = () => `<div class="overview">${meterList('Licences, own repos', Object.entries(licences).sort((a, b) => b[1] - a[1]).map(([n, v]) => [n, v, String(v)]))}${meterList('Languages, by your commits', languages())}</div>`;
const itemRow = it => `<div class="row"><span>${tag(it.kind)}</span><span class="t"><span class="repo">${esc(short(it.repo))}</span> · <a href="${it.url}">${esc(it.title)}</a></span><span class="muted small">${timeEl(it.at)}</span></div>`;
const groupRow = g => {
  const label = g.kind === 'commit' ? `${g.items.length} commits` : VERB[g.kind].replace('{n}', g.items.length);
  return `<details class="group"><summary class="row"><span>${tag(g.kind)}</span><span class="t"><span class="repo">${esc(short(g.repo))}</span> · ${label}</span><span class="muted small">${timeEl(g.at)}</span></summary>
    <div class="inner">${g.items.map(it => `<div class="t"><a href="${it.url}">${esc(it.title)}</a> <span class="muted small">${timeEl(it.at)}</span></div>`).join('')}</div></details>`;
};
const weeks = list => { const byW = new Map(); for (const g of grouped(list)) (byW.get(weekOf(g.at)) ?? byW.set(weekOf(g.at), []).get(weekOf(g.at))).push(g);
  return [...byW].map(([w, gs]) => `<h3>Week of ${new Date(w + 'T12:00:00Z').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric', timeZone:'UTC' })}</h3>${gs.map(g => g.group ? groupRow(g) : itemRow(g)).join('')}`).join(''); };
const profileLine = () => [
  D.profile.bio && `<span>${esc(D.profile.bio)}</span>`, `<span>on GitHub since ${D.profile.createdAt.slice(0, 4)}</span>`,
  D.profile.location && `<span>${esc(D.profile.location)}</span>`, D.profile.company && `<span>${esc(D.profile.company)}</span>`,
  D.profile.orgs.length && `<span>orgs: ${D.profile.orgs.map(o => `<a href="https://github.com/${o}">${o}</a>`).join(', ')}</span>`,
`<span><a href="https://github.com/${ME}?tab=achievements">achievements</a></span>`,
].filter(Boolean).join('');
const strip = () => `<div class="strip">${STATS.allTime.map(([l, n]) => `<div><span class="n">${n.toLocaleString()}</span><span class="l">${l}</span></div>`).join('')}<div class="sep"></div>
  ${STATS.year.map(([l, n]) => `<div><span class="n">${n.toLocaleString()}</span><span class="l">${l}</span></div>`).join('')}
  ${STATS.private ? `<div><span class="n">${STATS.private.toLocaleString()}</span><span class="l">private, last 12 months</span></div>` : ''}</div>`;
const projRow = (r, mode = 'depth', axis) => {
  const m = r.meta || {};
  const lic = m.licenseInfo && m.licenseInfo.spdxId !== 'NOASSERTION' ? `<span class="badge">${m.licenseInfo.spdxId}</span>` : '';
  const flags = [m.isArchived && '<span class="badge">archived</span>', m.isFork && !m.parent && '<span class="badge">fork of a deleted repo</span>', m.isFork && m.parent && adopted.has(r.repo) && `<span class="badge">fork of ${esc(m.parent.nameWithOwner)}</span>`].filter(Boolean).join('');
  const forks = r.forks.size ? `<span class="muted small"> · incl. commits in <a href="https://github.com/${[...r.forks][0]}">your fork</a></span>` : '';
  const counts = [['commit', 'commits'], ['pr', 'PRs'], ['issue', 'issues'], ['discussion', 'discussions']].filter(([k]) => mode === 'depth' || r[k]).map(([k, l]) => `<b>${r[k]}</b> ${l}`).join(' · ');
  const chart = mode === 'breadth' ? (P.get('rows') === 'spark' ? spark(r.weeks) : dotStrip(r.its, axis[0], axis[1])) : (P.get('depth') === 'spark' ? spark(r.weeks) : monthBars(r.months));
  return `<div class="proj ${mode === 'breadth' ? 'wide' : ''}"><div><span class="name" data-repo="${r.repo}">${esc(short(r.repo))}</span>${lic}${flags}${m.stargazerCount ? `<span class="muted small"> ★ ${m.stargazerCount.toLocaleString()}</span>` : ''}${forks}</div>
    ${m.description ? `<div class="small">${esc(m.description)}</div>` : ''}
    <div class="counts">${counts} · last active ${r.last ? timeEl(r.last) : '—'}</div>
    <div class="spark">${chart}</div></div>`;
};
const chips = (on, list) => `<div class="chips">${Object.keys(LABEL).map(k => `<button class="chip ${on.has(k) ? '' : 'off'}" data-k="${k}"><i style="background:var(--k-${k})"></i>${LABEL[k]} ${list.filter(i => i.kind === k).length}</button>`).join('')}</div>`;
const footer = () => `<footer>Built ${timeEl(D.generatedAt)} · ${new Date(D.generatedAt).toLocaleString('en-US', { timeZone: TZ })} (${TZ}). Public activity only. <span class="muted">Prototype: ?tz=Europe/London to try another time zone.</span></footer>`;
const cutoff = new Date(NOW - 365 * 864e5).toISOString();

// a year's summary (from the dropped year-by-year variant): totals and the most active repos
function yearSummary(y) {
  const its = items.filter(i => yearOf(i.at) === y && DEFAULT_ON.includes(i.kind)), by = k => its.filter(i => i.kind === k).length;
  const rc = {}; its.forEach(i => { const r = rowOf(i.repo); rc[r] = (rc[r] || 0) + 1; });
  const top = Object.entries(rc).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return `<p class="muted small">${(D.years[y]?.total ?? 0).toLocaleString()} contributions · ${by('commit')} commits · ${by('pr')} PRs · ${by('issue')} issues · ${by('discussion')} discussions · ${by('new_repo')} new repos<br>Most active in: ${top.map(([r, n]) => `<a href="https://github.com/${r}">${esc(short(r))}</a> (${n})`).join(', ')}</p>`;
}
// ---------- A: as specified ----------
function VariantA() {
  const app = document.getElementById('app'), state = { tab: 'feed', on: new Set(DEFAULT_ON), repo: null };
  const pr = projectRows();
  const draw = () => {
    const shown = items.filter(i => state.on.has(i.kind) && (!state.repo || rowOf(i.repo) === state.repo));
    const recent = shown.filter(i => i.at >= cutoff), older = shown.filter(i => i.at < cutoff);
    const yrs = [...new Set(older.map(i => yearOf(i.at)))].sort().reverse();
    app.innerHTML = `<div class="wrap"><h1>${esc(ME)} on GitHub</h1><div class="profile">${profileLine()}</div>${strip()}${overview()}${heatmap(D.lastYear.calendar)}
      <div class="tabs">${[['feed','Feed'],['projects','Projects'],['contributing','Contributing to']].map(([k, l]) => `<button data-tab="${k}" class="${state.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${state.tab === 'feed' ? `${chips(state.on, items)}${state.repo ? `<div class="filter">Showing only <b>${esc(short(state.repo))}</b> (including commits in your fork) · <a href="#" id="clear">show all</a></div>` : ''}
        <h2>Last 12 months</h2>${weeks(recent) || '<p class="muted">Nothing.</p>'}
        ${yrs.map(y => `<details class="year" data-y="${y}"><summary>${y} <span class="muted small">· ${older.filter(i => yearOf(i.at) === y).length} items${y === yearOf(cutoff) ? ', before the last 12 months' : ''}</span></summary><div class="body"></div></details>`).join('')}`
      : state.tab === 'projects' ? `<p class="proto">Prototype: each row shows commits per month over the last 24 months. <a href="?${new URLSearchParams({ ...Object.fromEntries(P), depth: P.get('depth') === 'spark' ? 'bars' : 'spark' })}">Compare with ${P.get('depth') === 'spark' ? 'monthly bars' : 'the old sparklines'}</a></p>${pr.favorites.length ? `<h2>Favorites</h2>${pr.favorites.map(r => projRow(r)).join('')}` : ''}
        <h2>My projects</h2>${pr.mine.slice(0, 15).map(r => projRow(r)).join('')}${pr.mine.length > 15 ? `<details><summary class="muted">${pr.mine.length - 15} more</summary>${pr.mine.slice(15).map(r => projRow(r)).join('')}</details>` : ''}
        <p class="note">${pr.idleForks} forks without commits of yours aren't listed (the "forked" items stay in the feed). Forks you did work in appear under Contributing to, on their upstream's row.</p>`
      : (() => { const ext = pr.external, from = Math.min(...ext.flatMap(r => r.its.map(i => +new Date(i.at)))), axis = [from, NOW];
          const owners = new Set(ext.map(r => r.repo.split('/')[0]));
          const byOwner = P.get('group') === 'owner';
          const rows = byOwner ? [...owners].map(o => ({ o, rs: ext.filter(r => r.repo.startsWith(o + '/')) })).sort((a, b) => b.rs.length - a.rs.length || b.rs[0].last.localeCompare(a.rs[0].last)) : [{ o: null, rs: ext }];
          return `<div class="kpis"><div><span class="n">${ext.length}</span><span class="l">repos</span></div><div><span class="n">${owners.size}</span><span class="l">owners and orgs</span></div><div><span class="n">${new Date(from).getUTCFullYear()}</span><span class="l">first contribution</span></div></div>
            ${reposPerYear(ext)}
            <p class="proto">Prototype: one dot per commit, PR, issue or discussion, on a shared timeline (hover a dot). <a href="?${new URLSearchParams({ ...Object.fromEntries(P), rows: P.get('rows') === 'spark' ? 'dots' : 'spark' })}">Compare with ${P.get('rows') === 'spark' ? 'dots' : 'sparklines'}</a> · <a href="?${new URLSearchParams({ ...Object.fromEntries(P), group: byOwner ? 'none' : 'owner' })}">${byOwner ? 'Ungroup' : 'Group by owner'}</a></p>
            ${axisRow(axis[0], axis[1])}
            ${rows.map(g => `${g.o ? `<div class="owner">${esc(g.o)} · ${g.rs.length} repo${g.rs.length > 1 ? 's' : ''}</div>` : ''}${g.rs.map(r => projRow(r, 'breadth', axis)).join('')}`).join('')}`; })()}
      ${footer()}</div>`;
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; draw(); });
    app.querySelectorAll('.chip').forEach(b => b.onclick = () => { const k = b.dataset.k; state.on.has(k) ? state.on.delete(k) : state.on.add(k); draw(); });
    app.querySelectorAll('.proj .name').forEach(b => b.onclick = () => { state.repo = b.dataset.repo; state.tab = 'feed'; draw(); scrollTo(0, 0); });
    app.querySelector('#clear')?.addEventListener('click', e => { e.preventDefault(); state.repo = null; draw(); });
    app.querySelectorAll('details.year').forEach(d => d.addEventListener('toggle', async () => {
      const b = d.querySelector('.body'); if (!d.open || b.dataset.loaded) return;
      const y = d.dataset.y; b.dataset.loaded = '1'; b.innerHTML = `<p class="muted small">Loading ${y}…</p>`;
      const t0 = performance.now(), Y = await yearFile(y);
      const full = [...Y.items, ...Y.commits.map(c => ({ kind: 'commit', at: c.at, repo: c.repo, title: c.msg, url: c.url }))]
        .filter(i => state.on.has(i.kind) && (!state.repo || rowOf(i.repo) === state.repo)).sort((a, b) => b.at.localeCompare(a.at));
      b.innerHTML = `<p class="proto">Prototype: loaded years/${y}.json on opening (${Math.round(performance.now() - t0)} ms). <a href="?year=${y}">Open ${y} on its own page</a></p>` + yearSummary(y) + heatmap(Y.calendar) + weeks(full);
    }));
  };
  draw();
}

// ---------- a year on its own page (?year=2017): what a no-JavaScript visitor gets from the year link ----------
async function YearPage(y) {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="wrap"><p class="muted">Loading ${y}…</p></div>`;
  const Y = await yearFile(y);
  const full = [...Y.items, ...Y.commits.map(c => ({ kind: 'commit', at: c.at, repo: c.repo, title: c.msg, url: c.url }))].filter(i => DEFAULT_ON.includes(i.kind)).sort((a, b) => b.at.localeCompare(a.at));
  const ys = D.split?.years ?? [], i = ys.indexOf(y);
  app.innerHTML = `<div class="wrap"><p><a href="?">← ${esc(ME)} on GitHub</a>${ys[i - 1] ? ` · <a href="?year=${ys[i - 1]}">${ys[i - 1]}</a>` : ''}${ys[i + 1] ? ` · <a href="?year=${ys[i + 1]}">${ys[i + 1]}</a>` : ''}</p>
    <h1>${y}</h1>${yearSummary(y)}${heatmap(Y.calendar)}${weeks(full)}${footer()}</div>`;
}

// ---------- switcher ----------
const V = { A: ['As specified', VariantA] }, keys = Object.keys(V);
const show = k => { V[k][1](); document.getElementById('plabel').textContent = `${k} (${V[k][0]}) · tz ${TZ}`; };
const go = d => { const i = keys.indexOf(P.get('variant') || 'A'); const k = keys[(i + d + keys.length) % keys.length]; P.set('variant', k); history.replaceState(null, '', '?' + P); show(k); scrollTo(0, 0); };
document.getElementById('prev').onclick = () => go(-1); document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', e => { if (e.target.closest('input,textarea,[contenteditable]')) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
if (P.has('year')) { YearPage(P.get('year')); document.getElementById('plabel').textContent = `Year page ${P.get('year')}`; }
else show(keys.includes(P.get('variant')) ? P.get('variant') : 'A');
})();
</script>
</body>
</html>
